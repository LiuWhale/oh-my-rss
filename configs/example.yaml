freshrss:
  # Path to FreshRSS SQLite DB. For Docker deployments, bind-mount this file or
  # the FreshRSS data directory into the summarizer container.
  db_path: /path/to/FreshRSS/data/users/your-user/db.sqlite
  category: 论文

site:
  # Public URL prefix matching output_dir.
  public_base_url: https://example.com/paper-feeds/summaries
  output_dir: ./site

codex:
  command: [codex, -a, never, -s, read-only, exec]
  timeout_seconds: 900
  reasoning_effort: low

arxiv_discovery:
  # Optional broad arXiv discovery. This supplements FreshRSS subscriptions
  # with keyword-based arXiv API candidates, then classifies by title/abstract
  # content instead of using arXiv subject names as public categories.
  enabled: false
  max_results: 100
  keywords: []

runtime:
  state_dir: ./state
  curl_bin: curl
  pdftotext_bin: pdftotext
  pdf_timeout_seconds: 120
  pdf_max_chars: 60000
