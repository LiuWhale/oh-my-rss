[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freshrss-arxiv-codex-summarizer"
version = "0.1.0"
description = "Generate Chinese Codex summaries for arXiv papers discovered in FreshRSS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FreshRSS arXiv Codex Summarizer contributors" }]
keywords = ["freshrss", "arxiv", "codex", "rss", "papers", "summarization"]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
freshrss-arxiv-codex = "freshrss_arxiv_summarizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
