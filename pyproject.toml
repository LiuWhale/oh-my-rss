[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oh-my-rss"
version = "0.1.18"
description = "RSS-driven research feeds automation for FreshRSS, Codex summaries, and static pages."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Oh My RSS contributors" }]
keywords = ["freshrss", "research", "codex", "rss", "papers", "summarization"]
dependencies = ["PyMuPDF>=1.24", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.6"]

[project.scripts]
oh-my-rss = "oh_my_rss.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
