name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, for example v0.1.3"
        required: true
        default: "v0.1.3"

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python -m build

      - name: Extract release notes
        run: |
          python - <<'PY'
          from pathlib import Path

          tag = "${{ env.TAG_NAME }}"
          version = tag.removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## [{version}]"
          start = changelog.find(marker)
          if start == -1:
              raise SystemExit(f"Missing changelog section for {version}")
          next_start = changelog.find("\n## [", start + len(marker))
          section = changelog[start: next_start if next_start != -1 else len(changelog)].strip()
          Path("release_notes.md").write_text(section + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub release
        run: |
          title="oh-my-rss $TAG_NAME"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/* --clobber
            gh release edit "$TAG_NAME" --latest
          else
            gh release create "$TAG_NAME" dist/* \
              --verify-tag \
              --latest \
              --title "$title" \
              --notes-file release_notes.md
          fi

  backfill-v0-1-3:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TAG_NAME: v0.1.3
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check existing release
        id: release
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.release.outputs.exists == 'false'
        with:
          ref: ${{ env.TAG_NAME }}

      - uses: actions/setup-python@v5
        if: steps.release.outputs.exists == 'false'
        with:
          python-version: "3.11"

      - if: steps.release.outputs.exists == 'false'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - if: steps.release.outputs.exists == 'false'
        run: python -m pip install --upgrade pip
      - if: steps.release.outputs.exists == 'false'
        run: python -m pip install -e ".[dev]"
      - if: steps.release.outputs.exists == 'false'
        run: python -m ruff check .
      - if: steps.release.outputs.exists == 'false'
        run: python -m pytest -q
      - if: steps.release.outputs.exists == 'false'
        run: python -m build

      - name: Extract release notes
        if: steps.release.outputs.exists == 'false'
        run: |
          python - <<'PY'
          from pathlib import Path

          tag = "${{ env.TAG_NAME }}"
          version = tag.removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          marker = f"## [{version}]"
          start = changelog.find(marker)
          if start == -1:
              raise SystemExit(f"Missing changelog section for {version}")
          next_start = changelog.find("\n## [", start + len(marker))
          section = changelog[start: next_start if next_start != -1 else len(changelog)].strip()
          Path("release_notes.md").write_text(section + "\n", encoding="utf-8")
          PY

      - name: Publish GitHub release
        if: steps.release.outputs.exists == 'false'
        run: |
          gh release create "$TAG_NAME" dist/* \
            --verify-tag \
            --latest=false \
            --title "oh-my-rss $TAG_NAME" \
            --notes-file release_notes.md

  normalize-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: backfill-v0-1-3
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Read current package tag
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(f"tag=v{data['project']['version']}")
          PY

      - name: Mark current version as latest
        run: |
          tag="${{ steps.version.outputs.tag }}"
          for attempt in $(seq 1 30); do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release edit "$tag" --latest
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Release $tag was not available to mark as latest"
