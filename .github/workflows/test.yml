name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - name: Run pytest
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest.log
      - name: Publish pytest failure summary
        if: failure()
        run: |
          {
            echo "### pytest failure"
            echo '```text'
            tail -n 200 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: python -m build
